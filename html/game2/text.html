<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>랜덤 합성 디펜스 - HARDCORE</title>
    <style>
        body { text-align: center; background-color: #111116; color: #fff; font-family: 'Malgun Gothic', sans-serif; margin: 0; overflow: hidden; }
        canvas { background-color: #1a1a22; border: 4px solid #4a3b3b; border-radius: 12px; cursor: default; margin-top: 15px; box-shadow: 0 10px 30px rgba(255,0,0,0.1); }
        .ui-info { margin-top: 8px; font-size: 14px; color: #9e8a8a; }
    </style>
</head>
<body>

    <h1 style="color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.3);">랜덤 합성 디펜스 : HARDCORE</h1>
    <canvas id="gameCanvas" width="840" height="640"></canvas>
    <div class="ui-info">
        <b>시작 자금 150G</b> | <b>소환할 때마다 비용 증가</b> | <b>몬스터 체력 지수 성장</b> | P: 일시정지
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- 게임 판 설정 ---
const TILE_SIZE = 80;
const MAP_ROWS = 8;
const MAP_COLS = 7; 
const MAX_LEVEL = 5;

const TOWER_TYPES = [
    { name: "불", color: "#ff4757", baseDmg: 16 },
    { name: "얼음", color: "#54a0ff", baseDmg: 12 },
    { name: "전기", color: "#feca57", baseDmg: 19 },
    { name: "독", color: "#1dd1a1", baseDmg: 24 }
];

// 지그재그 미로형 경로
const PATH_TILES = [
    {x: 0, y: 1}, {x: 1, y: 1}, {x: 2, y: 1}, {x: 3, y: 1}, {x: 4, y: 1}, {x: 5, y: 1}, 
    {x: 5, y: 2}, {x: 5, y: 3}, 
    {x: 4, y: 3}, {x: 3, y: 3}, {x: 2, y: 3}, {x: 1, y: 3}, 
    {x: 1, y: 4}, {x: 1, y: 5}, 
    {x: 2, y: 5}, {x: 3, y: 5}, {x: 4, y: 5}, {x: 5, y: 5}, {x: 6, y: 5}, 
    {x: 6, y: 6}, {x: 6, y: 7}  
];

let gameState = "lobby"; 
let gold = 150;        // 초기 자금 하향 (처음에 딱 1개 소환 가능)
let lives = 10;        // 라이프 하향 (허용치 축소)
let towerCost = 100;   // 초기 소환 비용
let wave = 1;
let enemies = [];
let towers = [];
let bullets = [];
let lightnings = []; 
let dragTower = null;
let waveTimer = 0;
let enemiesToSpawn = 0;

class Enemy {
    constructor(isBoss = false, isMidBoss = false) {
        this.pathIndex = 0;
        this.x = PATH_TILES[0].x * TILE_SIZE + TILE_SIZE/2;
        this.y = PATH_TILES[0].y * TILE_SIZE + TILE_SIZE/2 - 50;
        this.isBoss = isBoss;
        this.isMidBoss = isMidBoss;
        
        let hpMultiplier = isBoss ? 30 : (isMidBoss ? 10 : 1);
        
        // 📈 난이도 변경 핵심: 웨이브가 오를수록 체력이 지수함수 형태로 폭발적 성장
        this.hp = (80 + (wave * 90) * Math.pow(1.11, wave)) * hpMultiplier; 
        this.maxHp = this.hp;
        
        // 속도 약간 상향
        this.baseSpeed = isBoss ? 0.5 : 1.3 + (wave * 0.05);
        this.speed = this.baseSpeed;
        this.radius = isBoss ? 32 : (isMidBoss ? 23 : 14);

        this.burnTimer = 0;
        this.burnDamage = 0;
        this.slowTimer = 0;
        this.poisonTimer = 0;
        this.poisonDamage = 0;
    }

    move() {
        if (this.slowTimer > 0) {
            this.slowTimer--;
            this.speed = this.baseSpeed * 0.5; 
        } else {
            this.speed = this.baseSpeed;
        }

        if (this.burnTimer > 0) { this.burnTimer--; this.hp -= this.burnDamage; }
        if (this.poisonTimer > 0) { this.poisonTimer--; this.hp -= this.poisonDamage; }

        let target = PATH_TILES[this.pathIndex];
        if (!target) return true;
        let tx = target.x * TILE_SIZE + TILE_SIZE/2;
        let ty = target.y * TILE_SIZE + TILE_SIZE/2;
        let dist = Math.hypot(tx - this.x, ty - this.y);

        if (dist < this.speed) {
            this.pathIndex++;
            if (this.pathIndex >= PATH_TILES.length) return true; 
        } else {
            this.x += ((tx - this.x)/dist) * this.speed;
            this.y += ((ty - this.y)/dist) * this.speed;
        }
        return false;
    }

    draw() {
        if (this.poisonTimer > 0) ctx.fillStyle = "#26de81"; 
        else if (this.slowTimer > 0) ctx.fillStyle = "#45aaf2"; 
        else if (this.burnTimer > 0) ctx.fillStyle = "#ff3f34"; 
        else ctx.fillStyle = this.isBoss ? "#eb3b5a" : (this.isMidBoss ? "#fa8231" : "#a5b1c2");

        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
        
        if(this.isBoss || this.isMidBoss) {
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI*2); ctx.stroke();
        }

        ctx.fillStyle = "#333"; ctx.fillRect(this.x - 20, this.y - this.radius - 10, 40, 5);
        ctx.fillStyle = "#2ed573"; ctx.fillRect(this.x - 20, this.y - this.radius - 10, 40 * Math.max(0, this.hp/this.maxHp), 5);
    }
}

// [110행부터 이 내용으로 교체하세요]
class Tower {
    constructor(x, y, typeIdx, level = 1) {
        this.gridX = x; this.gridY = y;
        this.x = x * TILE_SIZE + TILE_SIZE/2;
        this.y = y * TILE_SIZE + TILE_SIZE/2;
        this.typeIdx = typeIdx; 
        this.level = level;
        this.type = TOWER_TYPES[typeIdx];
        this.range = 100 + (level * 30);
        // 성장형 공격력: 2.5배 지수 성장 적용
        this.damage = this.type.baseDmg * Math.pow(2.5, level - 1);
        this.cooldown = 0;
        this.isDragging = false;
    }

    update() {
        if (this.cooldown > 0) this.cooldown--;
        if (this.cooldown === 0) {
            let target = enemies.find(e => Math.hypot(e.x - this.x, e.y - this.y) < this.range);
            if (target) {
                // 성장형 공격 속도: 레벨이 높을수록 쿨다운이 획기적으로 짧아짐
                if (this.typeIdx === 2) { 
                    this.triggerChainLightning(target);
                    this.cooldown = Math.max(8, 40 - (this.level * 7));
                } else {
                    bullets.push(new Bullet(this.x, this.y, target, this.damage, this.type.color, this.typeIdx, this.level));
                    this.cooldown = Math.max(10, 35 - (this.level * 6)); 
                }
            }
        }
    }
// [164행까지 교체 완료]

    triggerChainLightning(firstTarget) {
        let currentTarget = firstTarget;
        let chainCount = 0;
        let maxChains = 2 + this.level; 
        let hitEnemies = [currentTarget];

        currentTarget.hp -= this.damage;
        lightnings.push({ sx: this.x, sy: this.y, tx: currentTarget.x, ty: currentTarget.y, timer: 12 });

        while (chainCount < maxChains - 1) {
            let nextTarget = enemies.find(e => 
                !hitEnemies.includes(e) && 
                Math.hypot(e.x - currentTarget.x, e.y - currentTarget.y) < 120
            );
            if (nextTarget) {
                nextTarget.hp -= this.damage * 0.75; // 전이 데미지 감쇄율 상향 (75%만 적용)
                lightnings.push({ sx: currentTarget.x, sy: currentTarget.y, tx: nextTarget.x, ty: nextTarget.y, timer: 12 });
                hitEnemies.push(nextTarget);
                currentTarget = nextTarget;
                chainCount++;
            } else { break; }
        }
    }

    draw() {
        ctx.save();
        if (this.isDragging) ctx.globalAlpha = 0.5;
        ctx.fillStyle = this.type.color;
        ctx.shadowBlur = this.level * 4; ctx.shadowColor = this.type.color;
        
        ctx.beginPath();
        if(this.typeIdx === 0) ctx.roundRect(this.x - 25, this.y - 25, 50, 50, 6); 
        else if(this.typeIdx === 1) ctx.arc(this.x, this.y, 25, 0, Math.PI*2); 
        else if(this.typeIdx === 2) { 
            ctx.moveTo(this.x, this.y - 26); ctx.lineTo(this.x + 26, this.y);
            ctx.lineTo(this.x, this.y + 26); ctx.lineTo(this.x - 26, this.y);
        } else { 
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                ctx.lineTo(this.x + 26 * Math.cos(angle), this.y + 26 * Math.sin(angle));
            }
        }
        ctx.fill();

        ctx.fillStyle = "#000"; ctx.font = "bold 15px Arial"; ctx.textAlign = "center";
        ctx.fillText(this.level >= MAX_LEVEL ? "MAX" : `L${this.level}`, this.x, this.y + 5);
        ctx.restore();
    }
}

class Bullet {
    constructor(x, y, target, dmg, color, typeIdx, level) {
        this.x = x; this.y = y; this.target = target; this.dmg = dmg; this.color = color;
        this.typeIdx = typeIdx; this.level = level;
        this.speed = 12;
    }

    move() {
        let dx = this.target.x - this.x; let dy = this.target.y - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist < this.speed) { this.hitSplice(); return true; }
        this.x += (dx/dist) * this.speed; this.y += (dy/dist) * this.speed;
        return false;
    }

    hitSplice() {
        if (this.typeIdx === 0) { 
            let splashRange = 65;
            enemies.forEach(e => {
                if (Math.hypot(e.x - this.x, e.y - this.y) <= splashRange) {
                    e.hp -= this.dmg;
                    e.burnTimer = 140; // 화상 시간 소폭 축소
                    e.burnDamage = 0.18 * this.level; 
                }
            });
        } 
        else if (this.typeIdx === 1) { 
            let splashRange = 75;
            enemies.forEach(e => {
                if (Math.hypot(e.x - this.x, e.y - this.y) <= splashRange) {
                    e.hp -= this.dmg;
                    e.slowTimer = 120; // 슬로우 시간 소폭 축소 (긴장감 유도)
                }
            });
        } 
        else if (this.typeIdx === 3) { 
            this.target.hp -= this.dmg;
            this.target.poisonTimer = 300; 
            this.target.poisonDamage = 0.45 * this.level; 
        }
    }

    draw() {
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.typeIdx === 0 ? 7 : 4, 0, Math.PI*2); ctx.fill();
    }
}

function startWave() {
    enemiesToSpawn = (wave === 10 || wave === 20) ? 1 : 12 + wave;
    waveTimer = 0;
}

function update() {
    if (gameState !== "playing") return;
    
    waveTimer++;
    if (enemiesToSpawn > 0 && waveTimer % 50 === 0) {
        if (wave === 10) enemies.push(new Enemy(false, true));
        else if (wave === 20) enemies.push(new Enemy(true, false));
        else enemies.push(new Enemy());
        enemiesToSpawn--;
    }

    if (enemiesToSpawn === 0 && enemies.length === 0) {
        if (wave === 20) gameState = "victory";
        else { wave++; startWave(); gold += 100; towerCost += 5; }
    }

    enemies = enemies.filter(e => {
        if (e.move()) { lives -= (e.isBoss ? 10 : (e.isMidBoss ? 5 : 1)); return false; }
        if (e.hp <= 0) { gold += e.isBoss ? 350 : (e.isMidBoss ? 130 : 12); return false; }
        return true;
    });

    bullets = bullets.filter(b => !b.move());
    towers.forEach(t => { if(!t.isDragging) t.update(); });
    lightnings = lightnings.filter(l => { l.timer--; return l.timer > 0; });

    if (lives <= 0) gameState = "gameover";
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (gameState === "lobby") {
        ctx.fillStyle = "white"; ctx.font = "bold 32px Arial"; ctx.textAlign = "center";
        ctx.fillText("스테이지 선택 : 크레이지 하드코어", 420, 220);
        ctx.fillStyle = "#ff4757"; ctx.fillRect(270, 320, 300, 65);
        ctx.fillStyle = "white"; ctx.font = "20px Arial"; ctx.fillText("1스테이지 도전", 420, 358);
    } else {
        ctx.strokeStyle = "#252530";
        for(let r=0; r<MAP_ROWS; r++) {
            for(let c=0; c<MAP_COLS; c++) ctx.strokeRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }

        ctx.fillStyle = "#1e1e24";
        PATH_TILES.forEach(p => ctx.fillRect(p.x * TILE_SIZE, p.y * TILE_SIZE, TILE_SIZE, TILE_SIZE));

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.font = "14px Arial"; ctx.textAlign = "center";
        ctx.fillText("▶입구", PATH_TILES[0].x * TILE_SIZE + 40, PATH_TILES[0].y * TILE_SIZE + 45);

        towers.forEach(t => t.draw());
        enemies.forEach(e => e.draw());
        bullets.forEach(b => b.draw());

        lightnings.forEach(l => {
            ctx.strokeStyle = "#feca57"; ctx.lineWidth = 3;
            ctx.shadowBlur = 10; ctx.shadowColor = "#feca57";
            ctx.beginPath(); ctx.moveTo(l.sx, l.sy);
            let midX = (l.sx + l.tx) / 2 + (Math.random() * 20 - 10);
            let midY = (l.sy + l.ty) / 2 + (Math.random() * 20 - 10);
            ctx.lineTo(midX, midY); ctx.lineTo(l.tx, l.ty); ctx.stroke();
            ctx.shadowBlur = 0;
        });

        // 우측 하단 대시보드 UI
        ctx.fillStyle = "#111116"; ctx.fillRect(560, 480, 280, 160);
        ctx.fillStyle = "#ff4757"; ctx.fillRect(660, 520, 160, 60);
        ctx.fillStyle = "white"; ctx.shadowBlur = 5; ctx.shadowColor = "red";
        ctx.fillRect(663, 523, 154, 54); ctx.fillStyle = "#111116"; ctx.fillRect(665, 525, 150, 50);
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.font = "bold 14px Arial";
        ctx.fillText(`랜덤 소환 (${towerCost}G)`, 740, 555);

        ctx.textAlign = "left"; ctx.font = "bold 16px Arial";
        ctx.fillText(`보유 자금: ${gold} G`, 580, 532);
        ctx.fillStyle = lives <= 3 ? "#ff4757" : "white";
        ctx.fillText(`라이프: ${lives} / 10`, 580, 562);
        ctx.fillStyle = "white";
        ctx.fillText(`웨이브: ${wave} / 20`, 580, 592);
    }
    
    if (gameState === "gameover" || gameState === "victory") {
        ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = gameState === "victory" ? "#1dd1a1" : "#ff4757";
        ctx.font = "bold 45px Arial"; ctx.textAlign = "center";
        ctx.fillText(gameState === "victory" ? "HELL CLEAR!" : "YOU DIED", 420, 290);
        ctx.fillStyle = "white"; ctx.font = "18px Arial"; ctx.fillText("화면을 클릭하면 대기실 로비로 이동합니다", 420, 350);
    }
}

canvas.addEventListener("mousedown", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    
    if (gameState === "lobby") {
        if (mx > 270 && mx < 570 && my > 320 && my < 385) {
            gameState = "playing"; wave = 1; gold = 250; lives = 10; towerCost = 100; towers = []; startWave();
        }
    } else if (gameState === "playing") {
        if (mx > 660 && mx < 820 && my > 520 && my < 580) { spawnTower(); return; }
        dragTower = towers.find(t => Math.hypot(t.x - mx, t.y - my) < 28);
        if (dragTower) dragTower.isDragging = true;
    } else { gameState = "lobby"; }
});

canvas.addEventListener("mousemove", e => {
    if (dragTower) {
        const rect = canvas.getBoundingClientRect();
        dragTower.x = e.clientX - rect.left; dragTower.y = e.clientY - rect.top;
    }
});

canvas.addEventListener("mouseup", e => {
    if (!dragTower) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let gx = Math.floor(mx/TILE_SIZE), gy = Math.floor(my/TILE_SIZE);
    
    let onPath = PATH_TILES.some(p => p.x === gx && p.y === gy);
    let target = towers.find(t => t !== dragTower && t.gridX === gx && t.gridY === gy);

    if (!onPath && target && target.typeIdx === dragTower.typeIdx && target.level === dragTower.level && target.level < MAX_LEVEL) {
        target.level++; 
        target.range += 25; target.damage *= 2.15; // 레벨업 공격력 계수 상향
        towers = towers.filter(t => t !== dragTower);
    } else {
        if (!onPath && gx < MAP_COLS && gy < MAP_ROWS && !target) { dragTower.gridX = gx; dragTower.gridY = gy; }
        dragTower.x = dragTower.gridX * TILE_SIZE + TILE_SIZE/2;
        dragTower.y = dragTower.gridY * TILE_SIZE + TILE_SIZE/2;
    }
    dragTower.isDragging = false; dragTower = null;
});

function spawnTower() {
    if (gold < towerCost) return;
    let slots = [];
    for(let r=0; r<MAP_ROWS; r++) {
        for(let c=0; c<MAP_COLS; c++) {
            let onPath = PATH_TILES.some(p => p.x === c && p.y === r);
            let hasTower = towers.find(t => t.gridX === c && t.gridY === r);
            if (!onPath && !hasTower) slots.push({c,r});
        }
    }
    if (slots.length > 0) {
        let s = slots[Math.floor(Math.random()*slots.length)];
        towers.push(new Tower(s.c, s.r, Math.floor(Math.random()*4)));
        gold -= towerCost; 
    }
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
